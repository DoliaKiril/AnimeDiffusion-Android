name: Unpack Project into Repository

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack All Files
        run: |
          if [ -f "AnimeDiffusion_Project.zip" ]; then
            echo "Розпаковуємо архів..."
            unzip -o AnimeDiffusion_Project.zip
            rm AnimeDiffusion_Project.zip
          fi

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Розпаковано файли проєкту з архіву" || exit 0
          git
          push
