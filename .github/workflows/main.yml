name: Build AnimeDiffusion APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        run: |
          echo "=== Пошук та розпакування архіву ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Знайдено архів: $ZIP_FILE. Розпаковуємо..."
            unzip -o "$ZIP_FILE"
          else
            echo "Архів не знайдено, перевіряємо вже розпаковані файли..."
          fi
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK and CMake
        run: |
          echo "=== Встановлення NDK через вбудований Android SDK ==="
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Fetch stable-diffusion.cpp source
        run: |
          mkdir -p app/src/main/cpp/sd_cpp
          if [ ! -f "app/src/main/cpp/sd_cpp/CMakeLists.txt" ]; then
            git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git app/src/main/cpp/sd_cpp
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeDiffusion-SDXL-v1.0
          path: app/build/outputs/apk/release/*.apk
