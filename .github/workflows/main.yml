name: Build AnimeDiffusion APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Archive
        run: |
          echo "=== Розпакування архіву ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Знайдено: $ZIP_FILE. Розпаковуємо..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Enable AndroidX in gradle.properties
        run: |
          echo "=== Налаштування gradle.properties ==="
          echo "android.useAndroidX=true" > gradle.properties
          sed -i '/signingConfig = signingConfigs/d' app/build.gradle.kts || true

      - name: Install Vulkan and SPIRV Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers || true
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build
          sudo cmake --install /tmp/spirv-headers/build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install Android NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Fetch stable-diffusion.cpp
        run: |
          mkdir -p app/src/main/cpp/sd_cpp
          if [ ! -f "app/src/main/cpp/sd_cpp/CMakeLists.txt" ]; then
            git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp.git app/src/main/cpp/sd_cpp
          fi

      - name: Allow CMake to find host SPIRV-Headers
        run: |
          sed -i '1i set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)' app/src/main/cpp/CMakeLists.txt
          sed -i '2i set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)' app/src/main/cpp/CMakeLists.txt
          sed -i '3i list(APPEND CMAKE_PREFIX_PATH "/usr/local/share/cmake/SPIRV-Headers" "/usr/share/cmake/SPIRV-Headers")' app/src/main/cpp/CMakeLists.txt

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeDiffusion-SDXL-v1.0
          path: app/build/outputs/apk/debug/*.apk
